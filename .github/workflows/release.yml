name: Release

# Push a tag `v<version>` that matches ai-chat-panel/package.json to publish all three
# extensions (chat, usage, theme) to Open VSX and the VS Code Marketplace.
# Open VSX uses the OVSX_PAT repository secret. The Marketplace uses Trusted Publishing.
# workflow_dispatch only builds the packages and uploads them as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISHER: clanker-controller

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run check
      - run: npm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix files to the GitHub release
      id-token: write # authenticate to the VS Code Marketplace
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the Open VSX publishing secret
        if: github.ref_type == 'tag'
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Missing OVSX_PAT. Add it under Settings > Secrets and variables > Actions (see docs/publishing.md)."
            exit 1
          fi

      - name: Tag must match the extension version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./ai-chat-panel/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ai-chat-panel/package.json version ${version}. Bump the version, commit, then tag."
            exit 1
          fi

      - name: Build the packages
        run: |
          node scripts/package-marketplace.mjs --publisher "$PUBLISHER" --stage "$RUNNER_TEMP/clanker-publish"
          node scripts/package-marketplace.mjs --publisher "$PUBLISHER" --store marketplace --only usage --stage "$RUNNER_TEMP/clanker-publish-marketplace"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ runner.temp }}/clanker-publish/out/*.vsix

      - name: Publish to Open VSX
        if: github.ref_type == 'tag'
        run: |
          for f in "$RUNNER_TEMP"/clanker-publish/out/*.vsix; do
            npx --yes ovsx publish "$f" --skip-duplicate
          done

      - name: Publish to the VS Code Marketplace
        if: github.ref_type == 'tag'
        run: |
          for f in \
            "$RUNNER_TEMP"/clanker-publish/out/ai-chat-panel-*.vsix \
            "$RUNNER_TEMP"/clanker-publish-marketplace/out/clanker-usage-statusbar-*.vsix \
            "$RUNNER_TEMP"/clanker-publish/out/clanker-theme-*.vsix; do
            npx --yes @vscode/vsce publish --oidc --packagePath "$f" --skip-duplicate
          done

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        # A re-run of a tag (to publish what an earlier run could not) finds the release already there: add the files to it.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/clanker-publish/out/*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/clanker-publish/out/*.vsix --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
